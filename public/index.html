<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loaf</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.46" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.46/themes.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <script src="/loaf.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
  </head>
  <body class="min-h-screen bg-base-200">
    <header class="navbar gap-2 bg-base-100 px-4 shadow-sm">
      <div class="flex-1">
        <a href="/" class="inline-flex items-center gap-2 text-lg font-bold"><img src="/logo.svg" alt="" class="size-8" />Loaf</a>
      </div>
      <select x-data="themePicker" class="select select-sm w-44" aria-label="Theme"></select>
    </header>

    <main class="hero min-h-[calc(100vh-4rem)]">
      <div class="hero-content text-center">
        <div>
          <h1 class="text-4xl font-bold">Loaf is running</h1>
          <p class="mt-3">Edit <code class="kbd kbd-sm">public/index.html</code> to get started.</p>
        </div>
      </div>
    </main>
  </body>
</html>
