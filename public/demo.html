<title>Todos · Loaf</title>

<!-- This whole app is HTML. The data lives at /api/todos, created on first save. -->
<main x-data="collection('todos')" class="mx-auto max-w-md px-4 py-12">
  <div class="card bg-base-100 shadow-sm">
    <div class="card-body gap-4">
      <h1 class="card-title text-2xl">Todos</h1>

      <form @submit.prevent="add($el)" class="join w-full">
        <input name="text" required placeholder="What needs doing?" aria-label="New todo" class="input join-item w-full" />
        <button :disabled="saving" class="btn btn-primary join-item">Add</button>
      </form>

      <div x-show="error" role="alert" class="alert alert-error alert-soft"><span x-text="error"></span></div>
      <p x-show="!loading && !items.length" class="text-base-content/60">Nothing to do yet.</p>

      <ul class="list">
        <template x-for="todo in items" :key="todo.id">
          <li class="list-row items-center">
            <input type="checkbox" :checked="todo.done" @change="update(todo, { done: $el.checked })" aria-label="Done" class="checkbox checkbox-primary" />
            <span x-text="todo.text" :class="todo.done && 'line-through opacity-50'" class="list-col-grow break-words"></span>
            <button @click="remove(todo)" aria-label="Delete todo" class="btn btn-square btn-ghost btn-sm">✕</button>
          </li>
        </template>
      </ul>
    </div>
  </div>
</main>
