<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todos · Loaf</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.46" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.46/themes.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <script src="/loaf.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
  </head>
  <body class="min-h-screen bg-base-200">
    <header class="navbar gap-2 bg-base-100 px-4 shadow-sm">
      <div class="flex-1">
        <a href="/" class="inline-flex items-center gap-2 text-lg font-bold"><img src="/logo.svg" alt="" class="size-8" />Loaf</a>
      </div>
      <select x-data="themePicker" class="select select-sm w-44" aria-label="Theme"></select>
    </header>

    <!-- This whole app is HTML. The data lives at /api/todos, created on first save. -->
    <main x-data="collection('todos')" class="mx-auto max-w-md px-4 py-12">
      <div class="card bg-base-100 shadow-sm">
        <div class="card-body gap-4">
          <h1 class="card-title text-2xl">Todos</h1>

          <form @submit.prevent="add($el)" class="join w-full">
            <input name="text" required placeholder="What needs doing?" aria-label="New todo" class="input join-item w-full" />
            <button class="btn btn-primary join-item">Add</button>
          </form>

          <div x-show="error" role="alert" class="alert alert-error alert-soft"><span x-text="error"></span></div>
          <p x-show="!loading && !items.length" class="text-base-content/60">Nothing to do yet.</p>

          <ul class="list">
            <template x-for="todo in items" :key="todo.id">
              <li class="list-row items-center">
                <input type="checkbox" :checked="todo.done" @change="update(todo, { done: $el.checked })" aria-label="Done" class="checkbox checkbox-primary" />
                <span x-text="todo.text" :class="todo.done && 'line-through opacity-50'" class="list-col-grow break-words"></span>
                <button @click="remove(todo)" aria-label="Delete todo" class="btn btn-square btn-ghost btn-sm">✕</button>
              </li>
            </template>
          </ul>
        </div>
      </div>
    </main>
  </body>
</html>
