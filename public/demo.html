<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todos · Loaf</title>
    <link rel="icon" href="/favicon.svg" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <script src="/loaf.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-primary: #d9913b;
        --color-background: #1e1612;
        --color-card: #2d221b;
        --color-text: #f7f0e6;
      }
    </style>
  </head>
  <body class="min-h-screen bg-background font-sans text-text">
    <!-- This whole app is HTML. The data lives at /api/todos, created on first save. -->
    <main x-data="collection('todos')" class="mx-auto max-w-md px-4 py-12">
      <h1 class="mb-6 text-3xl font-bold text-primary">Todos</h1>

      <form @submit.prevent="add($el)" class="mb-6 flex gap-2">
        <input
          name="text"
          required
          placeholder="What needs doing?"
          aria-label="New todo"
          class="flex-1 rounded-lg bg-card px-3 py-2 outline-none focus:ring-2 focus:ring-primary"
        />
        <button class="rounded-lg bg-primary px-4 py-2 font-semibold text-background hover:opacity-90">Add</button>
      </form>

      <p x-show="error" x-text="error" class="mb-4 text-red-400"></p>
      <p x-show="!loading && !items.length" class="text-text/60">Nothing to do yet.</p>

      <ul class="space-y-2">
        <template x-for="todo in items" :key="todo.id">
          <li class="flex items-center gap-3 rounded-lg bg-card px-3 py-2">
            <input type="checkbox" :checked="todo.done" @change="update(todo, { done: $el.checked })" aria-label="Done" class="size-4 accent-primary" />
            <span x-text="todo.text" :class="todo.done && 'line-through text-text/50'" class="flex-1 break-words"></span>
            <button @click="remove(todo)" aria-label="Delete todo" class="text-text/60 hover:text-red-400">✕</button>
          </li>
        </template>
      </ul>
    </main>
  </body>
</html>
